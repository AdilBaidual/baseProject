# =============================================================================
# GitLab CI/CD для проекта с отдельными dev и prod папками
# =============================================================================

# =============================================================================
# Stages
# =============================================================================
stages:
  - lint
  - deploy

# =============================================================================
# Lint (только на Merge Requests)
# =============================================================================
lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    # Go linting
    - golangci-lint run -v
  only:
    - merge_requests
  cache:
    key: golangci-lint
    paths:
      - /tmp/golangci-lint-cache

# =============================================================================
# Deploy Development (при пуше в develop)
# =============================================================================
deploy_dev:
  stage: deploy
  image: alpine:latest
  environment:
    name: development
    url: http://$DEV_SERVER_HOST:$DEV_API_PORT
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEV_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      echo "🚀 Deploying to Development..."

      # Подключаемся к серверу и обновляем проект в папке dev
      ssh $DEV_SSH_USER@$DEV_SSH_HOST "
        echo '📁 Navigating to dev folder...'
        cd $DEV_PROJECT_PATH || exit 1

        echo '🔄 Pulling latest changes from develop branch...'
        git fetch origin
        git checkout develop
        git pull origin develop

        echo '🏗️ Building and restarting services...'
        docker-compose -f docker-compose.dev.yml down || true
        docker-compose -f docker-compose.dev.yml up -d --build

        echo '⏳ Waiting for services to start...'
        sleep 20
      "

      # Health check
      echo "🏥 Health check..."
      if ssh $DEV_SSH_USER@$DEV_SSH_HOST "curl -f -X POST http://localhost:$DEV_API_PORT/test"; then
        echo "✅ Development deployment successful!"
      else
        echo "❌ Health check failed, checking logs..."
        ssh $DEV_SSH_USER@$DEV_SSH_HOST "cd $DEV_PROJECT_PATH && docker-compose -f docker-compose.dev.yml logs --tail=50"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# =============================================================================
# Deploy Production (при пуше в main)
# =============================================================================
deploy_prod:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: http://$PROD_SERVER_HOST:$PROD_API_PORT
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$PROD_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      echo "🚀 Deploying to Production..."

      # Подключаемся к серверу и обновляем проект в папке prod
      ssh $PROD_SSH_USER@$PROD_SSH_HOST "
        echo '📁 Navigating to prod folder...'
        cd $PROD_PROJECT_PATH || exit 1

        echo '🔄 Pulling latest changes from main branch...'
        git fetch origin
        git checkout main
        git pull origin main

        echo '🏗️ Building and restarting services...'
        docker-compose -f docker-compose.prod.yml down || true
        docker-compose -f docker-compose.prod.yml up -d --build

        echo '⏳ Waiting for services to start...'
        sleep 30
      "

      # Health check
      echo "🏥 Health check..."
      if ssh $PROD_SSH_USER@$PROD_SSH_HOST "curl -f -X POST http://localhost:$PROD_API_PORT/test"; then
        echo "✅ Production deployment successful!"
      else
        echo "❌ Health check failed, checking logs..."
        ssh $PROD_SSH_USER@$PROD_SSH_HOST "cd $PROD_PROJECT_PATH && docker-compose -f docker-compose.prod.yml logs --tail=50"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
