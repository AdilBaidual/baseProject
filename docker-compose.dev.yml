# =============================================================================
# Docker Compose для development окружения
# =============================================================================
version: "3.8"

name: dev-project

services:
  api:
    container_name: dev_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HTTP_PORT}:${HTTP_SERVER_PORT}"
      - "${API_GRPC_PORT}:${GRPC_SERVER_PORT}"
    environment:
      - ENV=${ENV}
      - GRPC_SERVER_HOST=${GRPC_SERVER_HOST}
      - GRPC_SERVER_PORT=${GRPC_SERVER_PORT}
      - HTTP_SERVER_HOST=${HTTP_SERVER_HOST}
      - HTTP_SERVER_PORT=${HTTP_SERVER_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    networks:
      - dev_network

  postgres:
    container_name: dev_postgres
    image: postgres:alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:${POSTGRES_PORT}"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    command:
      ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  jaeger:
    container_name: dev_jaeger
    image: jaegertracing/all-in-one
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT}:16686"
      - "${JAEGER_AGENT_PORT}:14268"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - dev_network

  migrations:
    container_name: dev_migrations
    image: golang:1.23-alpine
    working_dir: /app
    volumes:
      - ./db:/app
    command: |
      sh -c "
        go install github.com/pressly/goose/v3/cmd/goose@latest &&
        goose -dir=/app postgres 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}' up
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev_network
    restart: "no"

volumes:
  dev_postgres_data:
    driver: local

networks:
  dev_network:
    driver: bridge
