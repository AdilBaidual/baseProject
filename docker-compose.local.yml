# =============================================================================
# Docker Compose для локального запуска
# =============================================================================
version: "3.8"

name: local-project

services:
  api:
    container_name: local_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HTTP_PORT}:${HTTP_SERVER_PORT}"
      - "${API_GRPC_PORT}:${GRPC_SERVER_PORT}"
    environment:
      - ENV=${ENV}
      - GRPC_SERVER_HOST=${GRPC_SERVER_HOST}
      - GRPC_SERVER_PORT=${GRPC_SERVER_PORT}
      - HTTP_SERVER_HOST=${HTTP_SERVER_HOST}
      - HTTP_SERVER_PORT=${HTTP_SERVER_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
      - JAEGER_AGENT_HOST=${JAEGER_AGENT_HOST}
      - JAEGER_AGENT_PORT=${JAEGER_AGENT_PORT}
    networks:
      - local_network
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  postgres:
    container_name: local_postgres
    image: postgres:alpine
    restart: unless-stopped
    command:
      ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:${POSTGRES_PORT}"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    networks:
      - local_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrations:
    container_name: local_migrations
    build:
      context: db/migrations
      dockerfile: Dockerfile
    command: sh -c "goose -dir=/app postgres postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE} up"
    volumes:
      - ./db:/app
    networks:
      - local_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  jaeger:
    container_name: local_jaeger
    image: jaegertracing/all-in-one
    restart: unless-stopped
    ports:
      - "${JAEGER_AGENT_PORT}:14268"
      - "${JAEGER_UI_PORT}:16686"
    networks:
      - local_network

volumes:
  local_postgres_data:

networks:
  local_network:
    driver: bridge
